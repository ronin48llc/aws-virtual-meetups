name: CD - Deploy on Merge

on:
  push:
    branches:
      - main
      - develop

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

jobs:
  # Gate the credential-dependent deploy/smoke jobs on whether the AWS deploy
  # role is actually configured. Secrets can't be referenced in a job-level
  # `if:`, so surface presence as a job output that downstream jobs gate on.
  # When AWS_DEPLOY_ROLE_ARN is absent, deploy + smoke-test skip cleanly (no
  # failure); add the secret and they run automatically. See #165.
  check-deploy-secrets:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check whether AWS_DEPLOY_ROLE_ARN is set
        id: check
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::AWS_DEPLOY_ROLE_ARN secret not set — skipping deploy and smoke-test."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: cdk/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cdk

      - name: Run tests
        run: npm test
        working-directory: cdk

  deploy:
    needs: [test, check-deploy-secrets]
    if: ${{ needs.check-deploy-secrets.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    # GitHub Environment gives prod an approval gate (configure required
    # reviewers on the `production` environment in repo settings) and lets
    # DOMAIN_NAME / HOSTED_ZONE_ID / IVS ARNs / ALARM_EMAILS be defined as
    # per-environment variables so dev and prod deploy with different values.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment
        id: set-env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      # DnsStack fail-fasts without domainName/hostedZoneId (#147), and prod
      # refuses to synth without alarmEmails. Catch missing configuration here
      # with an actionable message instead of a stack trace mid-deploy.
      - name: Validate deployment configuration
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          ALARM_EMAILS: ${{ vars.ALARM_EMAILS }}
        run: |
          missing=()
          [ -z "$DOMAIN_NAME" ] && missing+=("DOMAIN_NAME")
          [ -z "$HOSTED_ZONE_ID" ] && missing+=("HOSTED_ZONE_ID")
          if [ "${{ steps.set-env.outputs.environment }}" = "prod" ] && [ -z "$ALARM_EMAILS" ]; then
            missing+=("ALARM_EMAILS")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub environment variables: ${missing[*]}. Define them on the '${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}' environment (Settings → Environments)."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: cdk/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cdk

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build CDK context flags
        id: ctx
        run: |
          CTX="-c env=${{ steps.set-env.outputs.environment }}"
          CTX="$CTX -c domainName=${{ vars.DOMAIN_NAME }}"
          CTX="$CTX -c hostedZoneId=${{ vars.HOSTED_ZONE_ID }}"
          [ -n "${{ vars.IVS_STORAGE_CONFIG_ARN }}" ] && CTX="$CTX -c ivsStorageConfigArn=${{ vars.IVS_STORAGE_CONFIG_ARN }}"
          [ -n "${{ vars.IVS_ENCODER_CONFIG_ARN }}" ] && CTX="$CTX -c ivsEncoderConfigArn=${{ vars.IVS_ENCODER_CONFIG_ARN }}"
          [ -n "${{ vars.ALARM_EMAILS }}" ] && CTX="$CTX -c alarmEmails=${{ vars.ALARM_EMAILS }}"
          # Set SES_EMAIL_ENABLED=true once SES production access is granted
          # (see docs/RUNBOOK.md) so Cognito sends via the SES domain identity.
          [ -n "${{ vars.SES_EMAIL_ENABLED }}" ] && CTX="$CTX -c sesEmailEnabled=${{ vars.SES_EMAIL_ENABLED }}"
          echo "flags=$CTX" >> "$GITHUB_OUTPUT"

      - name: CDK synth
        run: npx cdk synth --quiet ${{ steps.ctx.outputs.flags }}
        working-directory: cdk

      - name: CDK deploy
        run: npx cdk deploy --all --require-approval never ${{ steps.ctx.outputs.flags }}
        working-directory: cdk

      # The frontend is a static SPA whose runtime config (Cognito IDs, API
      # URLs) comes from stack outputs. Generating config.js here — instead of
      # hand-editing and committing it — keeps the deployed frontend and the
      # deployed infrastructure from drifting apart.
      - name: Generate frontend runtime config
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
        run: |
          ENV_NAME=${{ steps.set-env.outputs.environment }}
          USER_POOL_ID=$(aws cloudformation describe-stacks --stack-name "VirtualMeetup-$ENV_NAME-Auth" \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" --output text)
          CLIENT_ID=$(aws cloudformation describe-stacks --stack-name "VirtualMeetup-$ENV_NAME-Auth" \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" --output text)
          cat > frontend/js/config.js <<EOF
          'use strict';

          // Generated by the CD pipeline from CloudFormation stack outputs.
          // Do not hand-edit the deployed copy — see .github/workflows/deploy.yml.
          window.COGNITO_USER_POOL_ID = '$USER_POOL_ID';
          window.COGNITO_CLIENT_ID = '$CLIENT_ID';
          window.API_BASE_URL = 'https://api.$DOMAIN_NAME';
          window.WS_BASE_URL = 'wss://ws.$DOMAIN_NAME';
          EOF
          echo "Generated config.js for $ENV_NAME:"
          cat frontend/js/config.js

      - name: Deploy frontend to S3 + invalidate CloudFront
        run: |
          ENV_NAME=${{ steps.set-env.outputs.environment }}
          BUCKET=$(aws cloudformation describe-stacks --stack-name "VirtualMeetup-$ENV_NAME-Frontend" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)
          DIST_ID=$(aws cloudformation describe-stacks --stack-name "VirtualMeetup-$ENV_NAME-Frontend" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          aws s3 sync frontend/ "s3://$BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

      # Scope output collection to this env's stacks — a bare
      # `describe-stacks` across the account mixes dev and prod outputs.
      - name: Export stack outputs to smoke-config.json
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
        run: |
          ENV_NAME=${{ steps.set-env.outputs.environment }}
          USER_POOL_ID=$(aws cloudformation describe-stacks --stack-name "VirtualMeetup-$ENV_NAME-Auth" \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" --output text)
          CLIENT_ID=$(aws cloudformation describe-stacks --stack-name "VirtualMeetup-$ENV_NAME-Auth" \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" --output text)
          node -e "
            require('fs').writeFileSync('smoke-config.json', JSON.stringify({
              apiUrl: 'https://api.' + process.env.DOMAIN_NAME,
              wsUrl: 'wss://ws.' + process.env.DOMAIN_NAME,
              cloudFrontUrl: 'https://' + process.env.DOMAIN_NAME,
              cognitoUserPoolId: process.argv[1],
              cognitoClientId: process.argv[2],
            }, null, 2));
          " "$USER_POOL_ID" "$CLIENT_ID"

      - name: Upload smoke config artifact
        uses: actions/upload-artifact@v4
        with:
          name: smoke-config
          path: smoke-config.json

  smoke-test:
    needs: [deploy]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: cdk/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cdk

      # Lands at the workspace root, which is exactly where
      # scripts/smoke-test.js resolves ../smoke-config.json from scripts/.
      - name: Download smoke config
        uses: actions/download-artifact@v4
        with:
          name: smoke-config

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run smoke tests
        run: node scripts/smoke-test.js
        env:
          SMOKE_TEST_USERNAME: ${{ secrets.SMOKE_TEST_USERNAME }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}

      # Page the operators through the same SNS topic CloudWatch alarms use —
      # a commit comment alone is easy to miss after an auto-deploy.
      - name: Notify alarm topic of smoke-test failure
        if: failure()
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          aws sns publish \
            --topic-arn "arn:aws:sns:${{ env.AWS_REGION }}:$ACCOUNT_ID:VirtualMeetupAlarms-${{ needs.deploy.outputs.environment }}" \
            --subject "Smoke tests FAILED after deploy ($SHORT_SHA)" \
            --message "Post-deployment smoke tests failed for ${{ github.repository }} commit ${{ github.sha }} on ${{ github.ref_name }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. See docs/RUNBOOK.md for the rollback procedure." \
            || echo "::warning::Could not publish to SNS alarm topic."

      - name: Post failure comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '❌ Smoke tests failed after deployment. See docs/RUNBOOK.md for rollback. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });
